<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Hive-Q²K Dual：可信监督与蜂学知识的双向闭环</title>
  <desc id="desc">室内外观测经过时空实体重建、双粒度质量与专家校准，形成群体行为知识。质量与行为证据共同驱动误差归因和人工复核；复核修正经分布校准、标签同步增强和渐进学习形成下一轮观测。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#45576a"/></marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#235789"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#223044}
    .title{font-size:29px;font-weight:700}.subtitle{font-size:18px;fill:#516176}
    .heading{font-size:23px;font-weight:700}.body{font-size:18px}.output{font-size:17px;font-weight:600}
    .edge{fill:none;stroke:#45576a;stroke-width:2.3;marker-end:url(#arrow)}
    .loop{fill:none;stroke:#235789;stroke-width:2.7;marker-end:url(#feedback)}
    .note{font-size:16px;fill:#516176}
  </style>
  <rect width="1500" height="760" fill="#fff"/>
  <text x="40" y="49" class="title">Hive-Q²K Dual：可信监督与蜂学知识的双向闭环</text>
  <text x="40" y="83" class="subtitle">将结构化观测误差转化为监督修正、分布调整与知识更新的依据</text>

  <rect x="40" y="135" width="180" height="225" rx="12" fill="#f4f6f8" stroke="#bdc8d3"/>
  <text x="130" y="180" text-anchor="middle" class="heading">双域观测</text>
  <text x="130" y="233" text-anchor="middle" class="body">室内红外</text>
  <text x="130" y="269" text-anchor="middle" class="body">室外可见光</text>
  <text x="130" y="329" text-anchor="middle" class="note">连续视频</text>

  <rect x="260" y="135" width="350" height="225" rx="12" fill="#f0f6fc" stroke="#9bb8d3"/>
  <text x="282" y="179" class="heading">① 可观测的时空实体</text>
  <text x="282" y="229" class="body">密度补检 · 身体结构校正</text>
  <text x="282" y="263" class="body">外观与姿态关联 · 可见性控制</text>
  <line x1="282" y1="293" x2="588" y2="293" stroke="#c4d5e6"/>
  <text x="282" y="329" class="output">个体位置 / 姿态 / 身份</text>

  <rect x="650" y="135" width="350" height="225" rx="12" fill="#f0f8f5" stroke="#9dbfb2"/>
  <text x="672" y="179" class="heading">② 可信监督形成</text>
  <text x="672" y="229" class="body">Q²：群组偏差与实例异常</text>
  <text x="672" y="263" class="body">Q-MoE：校准支持与专家分歧</text>
  <line x1="672" y1="293" x2="978" y2="293" stroke="#c1d9ce"/>
  <text x="672" y="329" class="output">监督强度 / 待复核分歧</text>

  <rect x="1040" y="135" width="410" height="225" rx="12" fill="#fbf7ee" stroke="#c9b88f"/>
  <text x="1062" y="179" class="heading">③ 蜂群行为与知识</text>
  <text x="1062" y="229" class="body">活动 · 密度 · 通量 · 近邻网络</text>
  <text x="1062" y="263" class="body">环境条件与蜂学解释</text>
  <line x1="1062" y1="293" x2="1428" y2="293" stroke="#dfd2b9"/>
  <text x="1062" y="329" class="output">可复核的个体与群体问题</text>

  <path d="M220 245 H250" class="edge"/>
  <path d="M610 245 H640" class="edge"/>
  <path d="M1000 245 H1030" class="edge"/>

  <rect x="940" y="470" width="510" height="180" rx="12" fill="#faf7fb" stroke="#b9a8c5"/>
  <text x="966" y="515" class="heading">误差归因与价值复核</text>
  <text x="966" y="558" class="body">定位误差来源，兼顾修正价值与多样性</text>
  <text x="966" y="610" class="output">修正实体与事件监督 · 更新知识支持度</text>

  <rect x="260" y="470" width="620" height="180" rx="12" fill="#f2f6fb" stroke="#9bb8d3"/>
  <text x="286" y="515" class="heading">分布校准与渐进学习</text>
  <text x="286" y="558" class="body">目标切片覆盖 · 标签同步增强 · B-TCA 时序增强</text>
  <text x="286" y="610" class="output">以可信监督推进双域课程，形成下一轮观测</text>

  <path d="M1245 360 V460" class="edge"/>
  <text x="1263" y="416" class="note">行为疑问</text>
  <path d="M825 360 V412 H1040 V460" class="edge"/>
  <text x="842" y="398" class="note">质量与误差证据</text>
  <path d="M940 560 H890" class="loop"/>
  <path d="M435 470 V370" class="loop"/>
  <text x="416" y="426" text-anchor="end" class="note">更新观测模型</text>
  <path d="M1450 605 H1478 V285 H1452" class="loop"/>
  <text x="1494" y="447" text-anchor="middle" class="note" transform="rotate(-90 1494 447)">更新知识支持度</text>
  <text x="40" y="715" class="subtitle">闭环作用于三个对象：视觉监督、学习分布与蜂学解释。</text>
</svg>
