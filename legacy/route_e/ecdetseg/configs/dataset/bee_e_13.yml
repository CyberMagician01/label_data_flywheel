task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']
  verbose: True
  max_dets: [1, 10, 300]

num_classes: 1
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /data/bee26/vitpose_size_ablation_13_20260827/data/bee_keypoints_13_20260827
    ann_file: /data/bee26/beeposetrack_e_20260827/data/annotations/train_13_rgb_ir.json
    return_masks: False
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /data/bee26/vitpose_size_ablation_13_20260827/data/bee_keypoints_13_20260827
    ann_file: /data/bee26/beeposetrack_e_20260827/data/annotations/val_13_rgb_ir.json
    return_masks: False
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
