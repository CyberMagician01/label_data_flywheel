__include__: [
  'e2_s_p2_local_joint_960.yml',
]

output_dir: /data/bee26/beeposetrack_e_20260827/work_dirs/e3_s_p2_joint_density_960
epochs: 40

train_dataloader:
  dataset:
    transforms:
      stop_epoch: 38

ECDet:
  enable_density: True
  density_in_channels: 192
  density_hidden_channels: 96
  enable_density_capacity: True
  min_density_queries: 128
  density_budget_ratio: 1.25
  density_budget_padding: 32
  training_density_budget_ratio: 2.0

ECTransformer:
  use_density_query: True
  use_pattern_query: True
  num_query_patterns: 8
  use_quality_head: True

ECCriterion:
  one2many_topk: 2
  one2many_loss_weight: 0.1
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,
                loss_keypoint: 10, loss_pose_oks: 2, loss_pose_box: 0.2, loss_pose_length: 0.2,
                loss_direction: 1, loss_visibility: 0.2,
                loss_density_map: 1, loss_density_count: 1, loss_quality: 0.1}
  losses: ['mal', 'boxes', 'local', 'pose', 'density', 'quality']
