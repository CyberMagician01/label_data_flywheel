__include__: [
  'e5_s_semisupervised_960.yml',
]

output_dir: /data/bee26/beeposetrack_e_20260827/work_dirs/e6_s_final_finetune_960
epochs: 30
warmup_iter: 200

train_dataloader:
  dataset:
    ann_file: /data/bee26/beeposetrack_e_20260827/data/annotations/train_13_rgb_ir.json
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: LetterBox, size: [960, 960], fill: 114}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
        - {type: ConvertKeypoints, normalize: True}
        - {type: PrepareTemporalFrames, size: [960, 960], fill: 114, lower: 0.01, upper: 0.99,
           mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
      stop_epoch: 28

optimizer:
  lr: 0.00005
  weight_decay: 0.000125
  params:
    - {params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.0000025}
    - {params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.0000025, weight_decay: 0.}
    - {params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.}
