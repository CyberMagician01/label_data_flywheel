__include__: [
  'e4_s_p2_joint_density_occlusion_960.yml',
]

output_dir: /data/bee26/beeposetrack_e_20260827/work_dirs/e5_s_temporal5_p2_joint_density_960
epochs: 50

ECDet:
  enable_density: True
  density_in_channels: 192
  density_hidden_channels: 96
  enable_temporal: True
  temporal_frames: 5
  use_temporal_difference: True
  use_frequency_gate: True
  temporal_feature_levels: 2

train_dataloader:
  dataset:
    type: TemporalCocoDetection
    temporal_frames: 5
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: RandomBeeKeypointOcclusion, p: 0.5, max_regions: 3, min_scale: 0.25, max_scale: 0.60, fill: 114}
        - {type: LetterBox, size: [960, 960], fill: 114}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
        - {type: ConvertKeypoints, normalize: True}
        - {type: PrepareTemporalFrames, size: [960, 960], fill: 114, lower: 0.01, upper: 0.99,
           mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
      stop_epoch: 48

val_dataloader:
  dataset:
    type: TemporalCocoDetection
    temporal_frames: 5
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: LetterBox, size: [960, 960], fill: 114}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: True}
        - {type: PrepareTemporalFrames, size: [960, 960], fill: 114, lower: 0.01, upper: 0.99,
           mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
