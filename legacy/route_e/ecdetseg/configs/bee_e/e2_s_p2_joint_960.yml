__include__: [
  'e1_s_p2_q768_960.yml',
]

output_dir: /data/bee26/beeposetrack_e_20260827/work_dirs/e2_s_p2_joint_960
epochs: 92

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: RandomHorizontalFlipWithKeypoints, p: 0.5}
        - {type: LetterBox, size: [960, 960], fill: 114}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
        - {type: ConvertKeypoints, normalize: True}
      policy: default
      stop_epoch: 90

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: LetterBox, size: [960, 960], fill: 114}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: True}
      policy: default

ECTransformer:
  num_keypoints: 2
  num_queries: 768

ECCriterion:
  loss_warmup_epochs: 10
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,
                loss_keypoint: 10, loss_pose_oks: 2, loss_pose_box: 0.2, loss_pose_length: 0.2,
                loss_direction: 1, loss_visibility: 0.2}
  losses: ['mal', 'boxes', 'local', 'pose']
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, cost_keypoint: 4, cost_oks: 2, cost_direction: 1}
    alpha: 0.25
    gamma: 2.0

optimizer:
  lr: 0.0001
  weight_decay: 0.000125
  params:
    - {params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.000005}
    - {params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.000005, weight_decay: 0.}
    - {params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.}
