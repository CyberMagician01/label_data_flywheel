__include__: ['e3_formal_query_1280.yml']

output_dir: /data/bee26/beeposetrack_e_20260827/work_dirs/e_formal_v2/e4_temporal_domain_1280
epochs: 50
evaluation_profile: full
inline_eval: true

pareto_metrics:
  bbox_ap: max
  rgb_ap: max
  ir_ap: max
  pose_pck10: max
  pose_nme: min
  orientation_accuracy: max
  head_tail_swap_rate: min
  query_utilization: max
  latency_p99_ms: min
  density_relative_mae: min
  idf1_fixed_tracker: max

ECDet:
  enable_temporal: True
  temporal_frames: 5
  use_temporal_difference: True
  use_frequency_gate: True
  enable_domain_adapter: True

ECTransformer:
  use_track_geometry_head: True

ECCriterion:
  losses: ['mal', 'boxes', 'local', 'pose', 'density', 'quality', 'pattern', 'domain', 'track', 'ir_hard_negative']

train_dataloader:
  unlabelled_ratio: 0.0
  dataset:
    type: TemporalCocoDetection
    temporal_frames: 5
    transforms:
      ops:
        - {type: BeeTargetCenteredCrop, p: 0.3, scale: [0.65, 0.95], min_instances: 1, min_short_side: 2, max_truncation: 0.2}
        - {type: BeeDirectionRotation, p: 0.3, degrees: 12, fill: 114}
        - {type: RandomHorizontalFlipWithKeypoints, p: 0.5}
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: IRSensorAugment, p: 0.5, gain: [0.9, 1.1], offset: [-8, 8], noise_std: [0, 4], blur_p: 0.2, hot_pixel_p: 0.001}
        - {type: BeeRGBSensorAugment, p: 0.5, brightness: [0.85, 1.15], contrast: [0.85, 1.15], saturation: [0.85, 1.15], shadow_factor: [0.65, 0.95], motion_kernels: [1, 3, 5]}
        - {type: LetterBox, size: [1280, 1280], fill: 114}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
        - {type: ConvertKeypoints, normalize: True}
        - {type: PrepareTemporalFrames, size: [1280, 1280], fill: 114, lower: 0.01, upper: 0.99, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
      stop_epoch: 48

val_dataloader:
  dataset:
    type: TemporalCocoDetection
    temporal_frames: 5
    transforms:
      ops:
        - {type: IRPercentileNormalize, lower: 0.01, upper: 0.99}
        - {type: LetterBox, size: [1280, 1280], fill: 114}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: True}
        - {type: PrepareTemporalFrames, size: [1280, 1280], fill: 114, lower: 0.01, upper: 0.99, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
