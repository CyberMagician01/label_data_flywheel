__include__: ['e_route_continuous_1280.yml']

output_dir: /data/bee26/beeposetrack_e_route_v5_unified_20260901/work_dirs/e_p0b_public_pose_1280_seed2026
seed: 2026
epochs: 12
warmup_iter: 100
checkpoint_freq: 1
evaluation_profile: full
inline_eval: false
external_eval: {enabled: false}
pareto_metrics:
  bbox_ap: max
  pose_pck10: max
  pose_nme: min
  head_tail_swap_rate: min
enable_continuous_stage_training: false
require_equal_domain_updates: false
enable_online_pseudo: false
bee_e_initialization: null
bee_e_split_contract: null
bee_e_design_evidence: null
bee_e_input_distribution_evidence: null

ViTAdapter:
  freeze_domain_bn_stats: true

HybridEncoder:
  freeze_domain_bn_stats: true

ECDet:
  enable_temporal: false
  temporal_stage_multiplier: 0.0

ECCriterion:
  losses: ['mal', 'boxes', 'local', 'pose', 'density', 'quality']

train_dataloader:
  total_batch_size: 2
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  shuffle: true
  domain_balanced: false
  dataset:
    type: TemporalCocoDetection
    img_folder: /data/bee26/datasets/bee_e_y_unified_20260901
    ann_file: /data/bee26/beeposetrack_e_route_v5_unified_20260901/data/public_preadaptation_v1/public_pose_train_schema_v2.json
    expected_ann_sha256: 291352eeb70775865f26dc9743271ca3ca1ad8673289049e0d37d006b267a744
    strict_domain_schema: true
    strict_schema: true
    schema_version: 2
    temporal_frames: 1
    temporal_offsets: [0]
    enable_btca_metadata: false
    transforms:
      ops:
        - {type: BeeTargetCenteredCrop, p: 0.30, scale: [0.65, 0.95], min_instances: 1, min_short_side: 2, max_truncation: 0.20}
        - {type: BeeDirectionRotation, p: 0.30, degrees: 12, fill: 114}
        - {type: BeeDirectionGapRotation, p: 0.30, bins: 12, max_degrees: 30, min_endpoint_retention: 1.0, fill: 114}
        - {type: RandomBeeKeypointOcclusion, p: 0.50, max_regions: 3, min_scale: 0.25, max_scale: 0.60, fill: 114}
        - {type: RandomHorizontalFlipWithKeypoints, p: 0.50}
        - {type: BeeRGBSensorAugment, p: 0.50, brightness: [0.85, 1.15], contrast: [0.85, 1.15], saturation: [0.85, 1.15], shadow_factor: [0.65, 0.95], motion_kernels: [1, 3, 5]}
        - {type: LetterBox, size: [1280, 1280], fill: 114}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
        - {type: ConvertKeypoints, normalize: true}
      policy: default
      stop_epoch: 12
  collate_fn: {mixup_prob: 0.0, mixup_epoch: 0}

val_dataloader:
  total_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  dataset:
    type: TemporalCocoDetection
    img_folder: /data/bee26/datasets/bee_e_y_unified_20260901
    ann_file: /data/bee26/beeposetrack_e_route_v5_unified_20260901/data/public_preadaptation_v1/public_pose_val_schema_v2.json
    expected_ann_sha256: e5680a1dca6e46fb4e9312758798fa6badb0c06d209dd2db0eb4e0c4b71dc6c8
    strict_domain_schema: true
    strict_schema: true
    schema_version: 2
    temporal_frames: 1
    temporal_offsets: [0]
    transforms:
      ops:
        - {type: LetterBox, size: [1280, 1280], fill: 114}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: true}
      policy: default
