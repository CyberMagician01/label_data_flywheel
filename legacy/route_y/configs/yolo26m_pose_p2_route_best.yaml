# BeePoseTrack-Y Route-Best YOLO26m-Pose-P2.
# Uses P2-P5 pose outputs, N=1 class, kpt_shape=head/tail.

nc: 1
end2end: True
reg_max: 1
kpt_shape: [2, 3]
scale: m
scales:
  m: [0.50, 1.00, 512]

backbone:
  - [-1, 1, FiveFrameInputAdapter, [5]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, BeeRouteBlock, [256, True, True, True, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, BeeRouteBlock, [128, True, True, True, True]]
  - [-1, 1, BeeDensityTap, [128]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, BeeRouteBlock, [256, True, True, True, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  - [[23, 27, 30, 33], 1, Pose26, [nc, kpt_shape]]
