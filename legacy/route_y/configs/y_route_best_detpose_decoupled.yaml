  dataset_yaml: /data/bee26/beeposetrack_y_20260827/datasets/y_unified_20260901_labelme5_a1_strict_v8_annotator01_val_03_test_detposemask/bee_yolo_pose_strict.yaml
  manifest: /data/bee26/beeposetrack_y_20260827/datasets/y_unified_20260901_labelme5_a1_strict_v8_annotator01_val_03_test_detposemask/dataset_manifest.jsonl
  expected_splits: [train, val, test]
  split_annotators:
    train: ["004", "02", "05"]
    val: ["01"]
    test: ["03"]
model:
  base_scale: m
  y1_yaml: /data/bee26/beeposetrack_y_20260827/configs/yolo26m_pose_p2_y1.yaml
  y2_yaml: /data/bee26/beeposetrack_y_20260827/configs/yolo26m_pose_p2_y2_structure.yaml
  route_yaml: /data/bee26/beeposetrack_y_20260827/configs/yolo26m_pose_p2_route_best.yaml
