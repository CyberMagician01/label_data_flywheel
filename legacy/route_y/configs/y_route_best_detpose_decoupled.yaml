  input_size: 1280
  clip_len: 5
  temporal_strides: [1, 2, 4]
  max_det: 768
  kpt_shape: [2, 3]
  use_p2: true
  use_rep_tdc: true
  use_frequency_gate: true
  use_domain_experts: true
  use_density_head: true
  pose_aware_nms: true
training:
  seed: 2026
  device: "1"
  batch: 2
  nbs: 16
  workers: 4
  optimizer: MuSGD
  lr0: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  amp: true
  grad_clip: 10.0
  warmup_epochs: 10
  patience: 20
  run_suffix: strict_v8_detposemask_decoupled
  y0_epochs: 40
  y0_patience: 10
  y1_epochs: 100
  y1_patience: 20
  y2_epochs: 40
  y2_patience: 12
  y3_epochs: 60
  y3_patience: 16
  y5_epochs: 30
  y5_patience: 8
  y5_lr_scale: 0.1
augmentation:
  close_mosaic: 20
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0
  erasing: 0.0
  degrees: 10.0
  translate: 0.10
  scale: 0.30
  fliplr: 0.5
  flipud: 0.0
loss:
  rle: 1.0
  oks: 1.0
  visibility: 0.5
  axis: 0.5
  inside: 0.2
  length: 0.2
  track: 0.1
  density: 0.1
  prototype: 0.05
tracking:
  max_age: 3
  max_cost: 1.35
  max_center_dist: 140.0
  max_candidates_per_frame: 384
  max_new_tracks_per_frame: 384
  max_active_tracks: 512
  hungarian_limit: 384
eval:
  five_frame: true
  candidate_conf: 0.001
  conf: 0.25
  iou: 0.7
  pose_iou: 0.3
  pr_iou: 0.5
